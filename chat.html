<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Villagrand AI</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
}

#chat {
  max-width: 500px;
  margin: 50px auto;
  background: white;
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.msg {
  margin: 10px 0;
  padding: 10px;
  border-radius: 6px;
}

.user {
  background: #e5f0ff;
  text-align: right;
}

.bot {
  background: #f2f2f2;
}

input {
  width: 75%;
  padding: 10px;
}

button {
  padding: 10px;
}
</style>

</head>

<body>

<div id="chat">
  <div id="messages"></div>

  <input id="input" placeholder="Ask about properties..." />
  <button onclick="send()">Send</button>
</div>

<script>

const API_URL = "https://project-g20up.vercel.app/api/chat";

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  document.getElementById("messages").appendChild(div);
}

async function send() {
  const input = document.getElementById("input");
  const msg = input.value.trim();

  if (!msg) return;

  addMessage(msg, "user");
  input.value = "";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: msg })
    });

    const result = await response.json();

    console.log("AI response:", result);

    if (result && result.reply) {
      addMessage(result.reply, "bot");
    } else {
      addMessage("No valid reply received.", "bot");
    }

  } catch (error) {
    console.error("Fetch error:", error);
    addMessage("Connection error.", "bot");
  }
}

</script>

</body>
</html>
